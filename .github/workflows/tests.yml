name: V1 baseline tests

on:
  push:
    branches:
      - main
      - v2-harness
  pull_request:
    branches:
      - main
      - v2-harness

permissions:
  contents: read

jobs:
  unittest:
    name: Python 3.12 unittest
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock.txt

      - name: Install locked dependencies
        run: python -m pip install --requirement backend/requirements.lock.txt

      - name: Run V1 baseline tests
        env:
          OPENAI_API_KEY: ""
          DEEPSEEK_API_KEY: ""
        run: python -m unittest discover -s tests -v
